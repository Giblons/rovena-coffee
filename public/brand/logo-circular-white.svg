<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Rovena Coffee Roastery">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Source+Sans+3:wght@400&amp;display=swap');
      .espresso { fill: #2B1E16; }
      .caramel { fill: #A67C52; }
      .cream { fill: #FAF6F0; }
    </style>
  </defs>
  <circle cx="200" cy="260" r="248" fill="#FFFFFF" stroke="#E8DFD4" stroke-width="2"/>
  <!-- RC Monogram -->
  <g transform="translate(128, 52)">
    <path class="espresso" d="M12 4h22c16 0 28 12 28 28v8c0 16-12 28-28 28H34v26H12V4zm22 18v34h10c6 0 10-4 10-10v-6c0-6-4-10-10-10H34z"/>
    <path class="espresso" fill="none" stroke="#2B1E16" stroke-width="7" stroke-linecap="round" d="M60 36c14 0 24 10 24 24s-10 24-24 24"/>
    <ellipse class="caramel" cx="60" cy="60" rx="11" ry="15"/>
    <path fill="#FAF6F0" d="M60 48c-2 4-3 8-3 12s1 8 3 12c2-4 3-8 3-12s-1-8-3-12z"/>
  </g>
  <!-- Wordmark -->
  <text x="200" y="210" text-anchor="middle" class="espresso" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="700" letter-spacing="0.14em">ROVENA</text>
  <!-- Tagline with hairlines -->
  <line x1="72" y1="248" x2="128" y2="248" stroke="#A67C52" stroke-width="1"/>
  <line x1="272" y1="248" x2="328" y2="248" stroke="#A67C52" stroke-width="1"/>
  <text x="148" y="252" font-family="'Source Sans 3', sans-serif" font-size="11" letter-spacing="0.2em" class="espresso">COFFEE</text>
  <ellipse cx="200" cy="246" rx="5" ry="7" class="caramel"/>
  <path fill="#FAF6F0" d="M200 240c-1 2-1 4-1 6s0 4 1 6c1-2 1-4 1-6s0-4-1-6z"/>
  <text x="212" y="252" font-family="'Source Sans 3', sans-serif" font-size="11" letter-spacing="0.2em" class="espresso">ROASTERY</text>
</svg>
